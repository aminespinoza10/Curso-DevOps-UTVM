name: Deploy backend application

on:
  push:
    branches: ["main"]

  workflow_dispatch: 

env:
  SERVICE_NAME: apiutvm
  IMAGE_BASE_NAME: aminespinoza/utvm:latest
  ENVIRONMENT_NAME: UTV-container-app-env
  RESOURCE_GROUP: infra-UTVM

jobs:
  UTVMBackend:
    name: Crear backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/API_UTVM

    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Azure Login
        uses: Azure/login@v1.4.6
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }} 

      - name: Install az containerapp extension
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker NET image
        run: | 
          docker build --platform linux --tag $IMAGE_BASE_NAME -f ./Dockerfile .

      - name: Publish Docker Backend image
        run: |
          docker push $IMAGE_BASE_NAME

      - name: Deploy Backend container App
        run: |          
          az containerapp up --name "$SERVICE_NAME" --resource-group $RESOURCE_GROUP --environment $ENVIRONMENT_NAME --target-port 8080 --image $IMAGE_BASE_NAME
          az containerapp ingress enable -n "$SERVICE_NAME" -g $RESOURCE_GROUP --type external --target-port 8080 --transport auto

          
