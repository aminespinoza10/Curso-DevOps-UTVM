name: Compilar API UTVM

on:
  pull_request:
    branches: [ main ]

env:
  IMAGE_BASE_NAME: aminespinoza/apiutvm:latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      working-directory: src
      run: dotnet restore API_UTVM.sln

    - name: Build
      working-directory: src
      run: dotnet build API_UTVM.sln --configuration Release --no-restore

    - name: Test
      working-directory: src
      run: dotnet test API_UTVM.sln --configuration Release --no-build --verbosity normal

    - name: Build Docker NET image
      working-directory: src/API_UTVM
      run: |
        docker build --platform linux --tag $IMAGE_BASE_NAME .
